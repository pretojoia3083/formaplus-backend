version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: formaplus_db
    environment:
      POSTGRES_USER: formaplus
      POSTGRES_PASSWORD: formaplus123
      POSTGRES_DB: formaplus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formaplus"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: formaplus_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://formaplus:formaplus123@db:5432/formaplus
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres_data:
