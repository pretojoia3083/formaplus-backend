version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: formaplus_db
    environment:
      POSTGRES_USER: formaplus
      POSTGRES_PASSWORD: formaplus123
      POSTGRES_DB: formaplus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formaplus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: formaplus_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: formaplus_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://formaplus:formaplus123@db:5432/formaplus
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: formaplus_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.local

  celery:
    build: ./backend
    container_name: formaplus_celery
    command: celery -A app.tasks.worker worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://formaplus:formaplus123@db:5432/formaplus
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db
    env_file:
      - ./backend/.env

volumes:
  postgres_data:
  redis_data:
